# Reward weights — must sum to 1.0
reward_weights:
  style: 0.45
  meaning: 0.40
  fluency: 0.15

# Model settings
model:
  generator_model_name: "google/flan-t5-small"
  sentence_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  max_new_tokens: 72

# Generation defaults
generation:
  num_candidates: 5
  temperature: 0.8
  top_p: 0.95

# Styles available for rewriting
styles:
  - poetic
  - journalistic
  - formal
